<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookMyMovie</title>

    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    /* ===== GLOBAL STYLE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Poppins', sans-serif;
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #1f2937;
    }

    /* ===== LOGIN CONTAINER ===== */
    .container {
        background: #ffffff;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        animation: fadeIn 0.6s ease;
    }

    .logo-section { text-align: center; margin-bottom: 30px; }

    .logo-circle {
        width: 80px; height: 80px; margin: 0 auto 15px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff9800, #ffb300);
        display: flex; justify-content: center; align-items: center;
        font-size: 35px; color: white;
        box-shadow: 0 8px 20px rgba(255,152,0,0.3);
        animation: floatLogo 3s ease-in-out infinite;
    }

    h2 { font-size: 24px; font-weight: 700; color: #111827; margin-bottom: 5px; }
    .subtitle { font-size: 13px; color: #6b7280; }

    /* ===== INPUTS ===== */
    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #4b5563; }
    
    input[type="text"], input[type="password"] {
        width: 100%; padding: 12px 16px; border-radius: 12px;
        border: 1px solid #d1d5db; outline: none; transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }

    input:focus {
        border-color: #ff9800;
        box-shadow: 0 0 0 4px rgba(255, 152, 0, 0.1);
    }

    /* ===== OPTIONS & BUTTONS ===== */
    .options {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 25px; font-size: 14px;
    }
    .forgot-link { color: #ff9800; text-decoration: none; font-weight: 500; }
    .forgot-link:hover { text-decoration: underline; }

    .btn {
        width: 100%; padding: 14px; border-radius: 12px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition: 0.3s; border: none; font-family: 'Poppins', sans-serif;
    }

    .login-btn {
        background: linear-gradient(135deg, #ff9800, #ffb300);
        color: white; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
    }

    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4); }

    .signup-link { margin-top: 25px; font-size: 14px; color: #6b7280; text-align: center; }
    .signup-link a { color: #ff9800; text-decoration: none; font-weight: 600; }

    /* ===== MODERN ALERT CSS ===== */
    .alert-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px);
        z-index: 9999; justify-content: center; align-items: center;
    }
    .alert-card {
        background: white; width: 90%; max-width: 350px; padding: 30px;
        border-radius: 24px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .alert-icon {
        width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 30px;
        background: #fee2e2; color: #dc2626;
    }
    .alert-confirm-btn {
        width: 100%; padding: 12px; background: #111827; color: white;
        border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 20px;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

</style>
</head>

<body>

<div class="container">
    <div class="logo-section">
        <div class="logo-circle">🎬</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to book your favorite movies</p>
    </div>

    <form action="Login" method="post" onsubmit="return validateLogin()">
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" id="username" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" id="password" placeholder="Enter password">
        </div>

        <div class="options">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" style="accent-color: #ff9800;"> Remember Me
            </label>
            <a href="Forgot.jsp" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn login-btn">Login</button>
    </form>

    <div class="signup-link">
        Don't have an account? <a href="Register.jsp">Create Account</a>
    </div>
</div>

<!-- MODERN ALERT MODAL -->
<div id="customAlert" class="alert-overlay">
    <div class="alert-card">
        <div class="alert-icon">✕</div>
        <h3 style="margin-bottom: 10px;">Login Failed</h3>
        <p id="alertMsg" style="color: #6b7280; font-size: 14px; line-height: 1.5;"></p>
        <button class="alert-confirm-btn" onclick="closeAlert()">Try Again</button>
    </div>
</div>

<script>
    /* Professional Alert Function */
    function showError(message) {
        document.getElementById("alertMsg").innerText = message;
        document.getElementById("customAlert").style.display = "flex";
    }

    function closeAlert() {
        document.getElementById("customAlert").style.display = "none";
    }

    /* Client-side Validation */
    function validateLogin() {
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value;

        if (user === "") {
            showError("Username is required to continue.");
            return false;
        }
        if (pass === "") {
            showError("Please enter your password.");
            return false;
        }
        return true;
    }

    /* Handle Server-side Errors from URL */
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("error") === "invalid") {
            showError("Invalid username or password. Please check your credentials.");
        }
    };
</script>

</body>
</html>
